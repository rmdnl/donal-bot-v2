trading:
  mode: "testnet"
  symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT"]
  poll_interval_seconds: 60
  fee_rate: 0.001
  min_order_usdt: 10.0
  dry_run: false

strategy:
  multi_regime_enabled: true
  donal:
    ema_fast_length: 20
    ema_slow_length: 60
    rsi_period: 14
    rsi_entry_level: 50
    rsi_exit_level: 45
    highest_high_period: 20
    atr_period: 14
    sl_multiplier: 1.5
    tp_multiplier: 2.5
  mean_reversion:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    sl_multiplier: 1.5
    tp_multiplier: 2.0
  breakeven:
    enabled: true
    trigger_atr_multiplier: 1.0

risk:
  risk_per_trade_pct: 1.0
  max_exposure_per_asset_pct: 7.5
  max_total_exposure_pct: 30.0
  daily_loss_limit_pct: 3.0
  weekly_loss_limit_pct: 5.0
  max_drawdown_pct: 10.0
  max_open_positions: 4

kill_switch:
  enabled: true
  crash_threshold_15m: 12.0
  volume_spike_multiplier: 5.0
  lookback_minutes: 15
  volume_baseline_minutes: 60
  cooldown_hours: 6.0

circuit_breaker:
  enabled: true
  api_max_failures: 5
  api_cooldown_seconds: 60
  order_max_failures: 3
  order_cooldown_seconds: 30

logging:
  level: "INFO"
  json_format: true
  log_file: "bot.log"
  max_size_mb: 10
  backup_count: 5
  console_output: true
  console_format: "text"

monitoring:
  telegram: {enabled: true}
  daily_report: {enabled: true, send_time_utc: "00:00"}
  anomaly_detector: {enabled: true, balance_check_interval_seconds: 3600}

database:
  sqlite_file: "data/trades.db"

dashboard:
  enabled: true
  port: 8501
